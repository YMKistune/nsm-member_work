version: '3.8'

services:
  app:
    build: ./nsm-member_work
    container_name: nsm_web_test
    ports:
      - "8080:80"
    volumes:
      - ./nsm-member_work:/var/www/html
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=nsm_member
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: nsm_db_test
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=nsm_member
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: